# Netlify lit ce fichier à l'import du dépôt : aucun réglage à saisir dans l'interface.
# Pas de commande de build : public/ est servi tel quel. Les en-têtes HTTP sont dans public/_headers.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # web-push est un module CommonJS : livré tel quel depuis node_modules plutôt que regroupé par esbuild.
  external_node_modules = ["web-push"]
